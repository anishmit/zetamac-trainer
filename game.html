<!doctype html>
<html>
  <head>
    <title>Arithmetic Game – Online Speed Drill</title>
    <link href="app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="game">
      <span class="left">Seconds left: 120</span>
      <span class="stats">
        <span class="correct">Score: 0</span>
        <span class="accuracy">Accuracy: 100% (0/0)</span>
      </span>
      <div class="banner">
        <div class="start">
          <span class="problem"></span>
          =
          <input class="answer" />
        </div>
        <div class="end">
          <p class="correct">Score: 0</p>
          <p>
            <a id="retry" href="game.html">Try again</a>
            or <a href="index.html">change settings</a>.
          </p>
        </div>
      </div>
    </div>
    <script>
      let speed = parseInt(new URLSearchParams(location.search).get('speed'));
      if (!(speed > 0)) {
        speed = 120;
      }
      history.replaceState(null, '', 'game.html?speed=' + speed);

      let duration = 120;
      let interval = duration / speed;
      let score = 0;
      let missed = 0;
      let timeLeft = duration;
      let correctAnswer;
      let problemTimer;
      let countdownTimer;

      let problemEl = document.querySelector('.problem');
      let answerEl = document.querySelector('.answer');
      let leftEl = document.querySelector('span.left');
      let scoreEl = document.querySelector('span.correct');
      let accuracyEl = document.querySelector('span.accuracy');
      let startDiv = document.querySelector('.start');
      let endDiv = document.querySelector('.end');
      let endScore = document.querySelector('.end p.correct');
      let banner = document.querySelector('.banner');
      let retryEl = document.querySelector('#retry');

      retryEl.href = 'game.html?speed=' + speed;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function updateAccuracy() {
        const total = score + missed;
        const percent = total === 0 ? 100 : Math.round(score * 100 / total);
        accuracyEl.textContent = 'Accuracy: ' + percent + '% (' + score + '/' + total + ')';
      }

      function resetAnswer() {
        answerEl.value = '';
        answerEl.focus();
      }

      function newProblem() {
        const operation = rand(0, 3);
        let problemText;
        if (operation === 0) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + ' + ' + b;
          correctAnswer = a + b;
        } else if (operation === 1) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + b + ' − ' + b;
          correctAnswer = a;
        } else if (operation === 2) {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a + ' × ' + b;
          correctAnswer = a * b;
        } else {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a * b + ' ÷ ' + a;
          correctAnswer = b;
        }
        problemEl.textContent = problemText;
        resetAnswer();
      }

      function restartProblemTimer() {
        clearInterval(problemTimer);
        problemTimer = setInterval(repeatProblem, interval * 1000);
      }

      function flash() {
        answerEl.style.borderColor = '#333333';
        setTimeout(function () {
          answerEl.style.borderColor = '';
        }, 150);
      }

      function repeatProblem() {
        missed++;
        updateAccuracy();
        flash();
        resetAnswer();
      }

      function endGame() {
        clearInterval(problemTimer);
        clearInterval(countdownTimer);
        startDiv.style.display = 'none';
        endDiv.style.display = 'block';
        banner.classList.add('wide');
        endScore.textContent = 'Score: ' + score;
      }

      function updateCountdown() {
        timeLeft--;
        leftEl.textContent = 'Seconds left: ' + timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }

      answerEl.addEventListener('input', function() {
        if (parseInt(answerEl.value) === correctAnswer) {
          score++;
          scoreEl.textContent = 'Score: ' + score;
          updateAccuracy();
          flash();
          newProblem();
          restartProblemTimer();
        }
      });

      leftEl.textContent = 'Seconds left: ' + timeLeft;
      updateAccuracy();
      newProblem();
      restartProblemTimer();
      countdownTimer = setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
