<!doctype html>
<html>
  <head>
    <title>Arithmetic Game – Online Speed Drill</title>
    <link href="app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="game">
      <span class="left">Seconds left: 120</span>
      <span class="correct">Score: 0</span>
      <span class="accuracy">
        <span class="fraction">0/0</span>
        <span class="percent">100%</span>
      </span>
      <div class="banner">
        <div class="start">
          <span class="problem"></span>
          =
          <input class="answer" />
        </div>
        <div class="end">
          <p class="correct">Score: 0</p>
          <p>
            <a id="retry" href="game.html">Try again</a>
            or <a href="index.html">change settings</a>.
          </p>
        </div>
      </div>
    </div>
    <script>
      let speed = parseInt(new URLSearchParams(location.search).get('speed'));
      if (!(speed > 0)) {
        speed = 120;
      }
      history.replaceState(null, '', 'game.html?speed=' + speed);

      let duration = 120;
      let timeLimit = duration * 1000 / speed;
      let score = 0;
      let inTime = 0;
      let timeLeft = duration;
      let correctAnswer;
      let problemStart;
      let lateTimer;
      let countdownTimer;

      let problemEl = document.querySelector('.problem');
      let answerEl = document.querySelector('.answer');
      let leftEl = document.querySelector('span.left');
      let scoreEl = document.querySelector('span.correct');
      let accuracyEl = document.querySelector('span.accuracy');
      let fractionEl = document.querySelector('span.fraction');
      let percentEl = document.querySelector('span.percent');
      let startDiv = document.querySelector('.start');
      let endDiv = document.querySelector('.end');
      let endScore = document.querySelector('.end p.correct');
      let banner = document.querySelector('.banner');
      let retryEl = document.querySelector('#retry');

      retryEl.href = 'game.html?speed=' + speed;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function alignAccuracy() {
        if (problemEl.offsetWidth === 0) {
          return;
        }
        accuracyEl.style.left = problemEl.offsetLeft + problemEl.offsetWidth / 2 + 'px';
      }

      function updateAccuracy() {
        const percent = score === 0 ? 100 : Math.round(inTime * 100 / score);
        fractionEl.textContent = inTime + '/' + score;
        percentEl.textContent = percent + '%';
      }

      function markLate() {
        answerEl.style.backgroundColor = '#cccccc';
      }

      function newProblem() {
        const operation = rand(0, 3);
        let problemText;
        if (operation === 0) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + ' + ' + b;
          correctAnswer = a + b;
        } else if (operation === 1) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + b + ' − ' + b;
          correctAnswer = a;
        } else if (operation === 2) {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a + ' × ' + b;
          correctAnswer = a * b;
        } else {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a * b + ' ÷ ' + a;
          correctAnswer = b;
        }
        problemEl.textContent = problemText;
        alignAccuracy();
        answerEl.value = '';
        answerEl.focus();
        answerEl.style.backgroundColor = '';
        clearTimeout(lateTimer);
        lateTimer = setTimeout(markLate, timeLimit + 1);
        problemStart = Date.now();
      }

      function endGame() {
        clearTimeout(lateTimer);
        clearInterval(countdownTimer);
        startDiv.style.display = 'none';
        endDiv.style.display = 'block';
        banner.classList.add('wide');
        endScore.textContent = 'Score: ' + score;
      }

      function updateCountdown() {
        timeLeft--;
        leftEl.textContent = 'Seconds left: ' + timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }

      answerEl.addEventListener('input', function() {
        if (parseInt(answerEl.value) === correctAnswer) {
          score++;
          if (Date.now() - problemStart <= timeLimit) {
            inTime++;
          }
          scoreEl.textContent = 'Score: ' + score;
          updateAccuracy();
          newProblem();
        }
      });

      window.addEventListener('resize', alignAccuracy);

      leftEl.textContent = 'Seconds left: ' + timeLeft;
      updateAccuracy();
      newProblem();
      countdownTimer = setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
